<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>How Well Do You Know Us?</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Quicksand:wght@500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════ */
:root {
  --lav-50:  #f5f0ff;
  --lav-100: #ede5ff;
  --lav-200: #dacefc;
  --lav-300: #c4b0f7;
  --lav-400: #a98ee8;
  --lav-500: #8f6ed4;
  --lav-700: #5e3fae;
  --pink-50:  #fff3f8;
  --pink-100: #ffe1ef;
  --pink-200: #ffc8e0;
  --pink-300: #ffa3cc;
  --pink-400: #f07caf;
  --pink-500: #e25a93;
  --cream: #fffcf7;
  --paper: #fffef9;
  --gold:  #f5d060;
  --ink:   #2d1f4a;
  --ink-2: #614f80;
  --ink-3: #9d8bbe;
  --good:    #5ecb98;
  --good-bg: #e6fbf1;
  --bad:     #f0829a;
  --bad-bg:  #ffe2e8;
  --radius: 24px;
  --serif: 'Instrument Serif', Georgia, serif;
  --hand:  'Caveat', cursive;
  --sans:  'Quicksand', -apple-system, sans-serif;
  --ease:   cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --shadow: 0 16px 40px -12px rgba(90, 60, 170, .28), 0 4px 12px -4px rgba(220, 90, 150, .12);
  --shadow-lg: 0 32px 70px -20px rgba(90, 60, 170, .38), 0 8px 20px -8px rgba(220, 90, 150, .16);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: transparent;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--lav-300); outline-offset: 3px; }
[hidden] { display: none !important; }
img { max-width: 100%; }

/* ═══════════════════════════════════════════════════
   SCROLL CONTAINER
═══════════════════════════════════════════════════ */
#scroll-wrap {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--lav-300) transparent;
}
#scroll-wrap::-webkit-scrollbar { width: 4px; }
#scroll-wrap::-webkit-scrollbar-track { background: transparent; }
#scroll-wrap::-webkit-scrollbar-thumb { background: var(--lav-300); border-radius: 4px; }

/* ═══════════════════════════════════════════════════
   FLOATING PARTICLES (behind content)
═══════════════════════════════════════════════════ */
.floaters {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.floater {
  position: absolute; bottom: -40px; opacity: 0;
  animation: floatUp linear infinite;
  will-change: transform;
}
@keyframes floatUp {
  0%   { transform: translate(0,0) rotate(0); opacity: 0; }
  10%  { opacity: var(--o,.5); }
  88%  { opacity: var(--o,.5); }
  100% { transform: translate(var(--drift,0),-110vh) rotate(var(--rot,0)); opacity: 0; }
}

/* Particle FX */
.fx { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.particle {
  position: absolute; left: 0; top: 0; line-height: 1;
  margin: -.5em 0 0 -.5em;
  animation: burst 1s var(--ease) forwards;
}
@keyframes burst {
  0%   { transform: translate(var(--sx),var(--sy)) scale(.2); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: translate(calc(var(--sx) + var(--dx)), calc(var(--sy) + var(--dy))) scale(1.1) rotate(var(--r)); opacity: 0; }
}
.particle.sad { animation: drop 1.1s cubic-bezier(.4,0,.8,.6) forwards; }
@keyframes drop {
  0%   { transform: translate(var(--sx),var(--sy)) scale(.6); opacity: 1; }
  100% { transform: translate(calc(var(--sx)+var(--dx)),calc(var(--sy)+var(--dy))) rotate(var(--r)) scale(.9); opacity: 0; }
}
.particle.rain { margin: 0; animation: rain linear forwards; }
@keyframes rain {
  0%  { transform: translate(var(--sx),-50px) rotate(0); opacity: 0; }
  8%  { opacity: 1; }
  100%{ transform: translate(calc(var(--sx)+var(--dx)),110vh) rotate(var(--r)); opacity: .8; }
}

/* ═══════════════════════════════════════════════════
   MAIN LAYOUT
═══════════════════════════════════════════════════ */
main {
  position: relative; z-index: 2;
  width: 100%; min-height: 100%;
  padding: 20px 20px calc(var(--safe-b) + 24px);
  display: flex; flex-direction: column; align-items: center;
}

/* ═══════════════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════════════ */
.screen { display: none; flex-direction: column; width: 100%; animation: fadeIn .5s var(--ease); }
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* ═══════════════════════════════════════════════════
   GLASS CARD  (reusable)
═══════════════════════════════════════════════════ */
.card {
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 28px;
  border: 1.5px solid rgba(255,255,255,.95);
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; inset-x: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--lav-300), var(--pink-300), var(--lav-300));
}

/* ═══════════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════════ */
.btn {
  position: relative; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 14px 32px; border-radius: 999px;
  font-weight: 700; font-size: 1.05rem; letter-spacing: .01em;
  transition: transform .2s var(--spring), box-shadow .25s, opacity .2s;
  user-select: none; -webkit-user-select: none;
}
.btn:active { transform: scale(.96); }
.btn-block { width: 100%; }
.btn-primary {
  color: #fff;
  background: linear-gradient(135deg, var(--lav-500) 0%, #c47ad4 55%, var(--pink-400) 100%);
  box-shadow: 0 12px 28px -10px rgba(140,100,210,.85), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-primary::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.4), transparent);
  transform: skewX(-20deg); animation: shimmer 3.5s ease-in-out infinite;
}
@keyframes shimmer { 0%,55%{ left:-60%; } 100%{ left:130%; } }
.btn-ghost {
  color: var(--lav-700); background: rgba(255,255,255,.8);
  border: 1.5px solid var(--lav-200); box-shadow: 0 2px 8px rgba(100,70,170,.08);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.btn-heart { display:inline-block; animation: beat 1.4s ease-in-out infinite; }
.btn-glow  { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow {
  0%,100%{ box-shadow: 0 12px 28px -10px rgba(140,100,210,.85), 0 0 0 0 rgba(240,120,170,.0); }
  50%    { box-shadow: 0 12px 28px -10px rgba(140,100,210,.85), 0 0 0 10px rgba(240,120,170,.18); }
}
@keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.3)} 30%{transform:scale(1)} 45%{transform:scale(1.18)} }

/* ═══════════════════════════════════════════════════
   WELCOME SCREEN
═══════════════════════════════════════════════════ */
#screen-welcome { align-items: center; justify-content: center; min-height: calc(100dvh - 40px); }
.welcome { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 10px 0; }

.polaroid-stack { position: relative; width: 180px; height: 212px; margin: 8px auto 24px; }
.polaroid {
  position: absolute; inset: 0; background: var(--paper);
  padding: 10px 10px 42px; border-radius: 3px; box-shadow: var(--shadow);
}
.p-back  { transform: rotate(-8deg) translate(-20px,8px); background: #fff7fb; }
.p-front { transform: rotate(3.5deg); animation: sway 6s ease-in-out infinite; }
@keyframes sway { 0%,100%{transform:rotate(3.5deg)} 50%{transform:rotate(1deg) translateY(-3px)} }
.photo {
  width:100%; height:100%; border-radius:2px;
  display:grid; place-items:center;
  background: linear-gradient(140deg, var(--lav-200), var(--pink-200));
  background-size: cover; background-position: center;
  box-shadow: inset 0 0 0 1px rgba(100,70,170,.06);
}
.photo.alt { background: linear-gradient(140deg, #fff0d4, var(--pink-100)); }
.photo-emoji { font-size: 60px; animation: beat 2.2s ease-in-out infinite; }
.caption {
  position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
  font-family: var(--hand); font-size: 1.5rem; color: var(--ink-2);
}
.sticker { position: absolute; z-index: 4; font-size: 24px; animation: twinkle 3s ease-in-out infinite; }
.s1 { top: -12px; right: -24px; color: var(--gold); }
.s2 { bottom: 24px; left: -32px; color: var(--pink-400); font-size: 28px; animation-delay:-1s; }
.s3 { bottom: -10px; right: -14px; color: var(--lav-400); animation-delay:-2s; }
@keyframes twinkle { 0%,100%{transform:scale(1) rotate(0); opacity:1} 50%{transform:scale(.75) rotate(20deg); opacity:.6} }

.eyebrow {
  font-size: .72rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  color: var(--ink-2); text-align: center;
}
.meta { margin-top: 10px; text-align: center; font-size: .84rem; color: var(--ink-3); }
.title {
  font-family: var(--serif); font-weight: 700; letter-spacing: -.02em;
  font-size: clamp(2.1rem, 9vw, 3rem); line-height: 1.04; margin-top: 6px;
}
.title em, .grad {
  font-style: italic;
  background: linear-gradient(90deg, var(--lav-500), var(--pink-500));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.tagline { font-family: var(--hand); font-size: 1.75rem; color: var(--pink-500); margin-top: 2px; }
.names { display: flex; align-items: center; gap: 10px; margin: 10px 0 22px; }
.name-chip {
  padding: 7px 18px; border-radius: 999px; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.85); border: 1.5px solid var(--lav-200);
  box-shadow: 0 2px 8px rgba(100,70,170,.08);
}
.amp { font-family: var(--hand); font-size: 1.9rem; color: var(--pink-400); }

/* ═══════════════════════════════════════════════════
   CHAPTER INTRO SCREEN
═══════════════════════════════════════════════════ */
#screen-chapter { justify-content: center; min-height: calc(100dvh - 40px); }
.chapter-card {
  position: relative; text-align: center;
  padding: 48px 28px 32px; border-radius: 28px;
  background: var(--paper); box-shadow: var(--shadow-lg);
  animation: chapterIn .7s var(--spring);
  border: 1.5px solid rgba(255,255,255,.95);
}
.chapter-card::after {
  content: ''; position: absolute; inset: 8px; border-radius: 22px;
  border: 1.5px dashed rgba(190,160,240,.4); pointer-events: none;
}
.chapter-card::before {
  content: ''; position: absolute; inset-x: 0; top: 0; height: 3px; border-radius: 28px 28px 0 0;
  background: linear-gradient(90deg, var(--lav-300), var(--pink-300), var(--lav-300));
}
@keyframes chapterIn { from { transform: scale(.88) rotate(-2deg); opacity:0; } to { transform: scale(1) rotate(0); opacity:1; } }
.chapter-num   { font-family: var(--hand); font-size: 1.5rem; color: var(--pink-500); }
.chapter-emoji { font-size: 68px; margin: 4px 0 2px; animation: bounce 2s var(--ease) infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.chapter-title { font-family: var(--serif); font-size: 2rem; line-height: 1.1; letter-spacing: -.01em; }
.chapter-desc  { color: var(--ink-2); margin: 10px auto 6px; max-width: 320px; line-height: 1.55; font-weight: 500; }
.chapter-count { font-size: .82rem; color: var(--ink-3); margin-bottom: 24px; font-weight: 600; letter-spacing: .05em; }

/* ═══════════════════════════════════════════════════
   HUD  (Question Header)
═══════════════════════════════════════════════════ */
.hud { padding: 2px 0 0; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chip {
  padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: .84rem;
  background: rgba(255,255,255,.88); border: 1.5px solid rgba(255,255,255,.95);
  box-shadow: 0 2px 8px rgba(100,70,170,.1); white-space: nowrap;
  max-width: 60%; overflow: hidden; text-overflow: ellipsis;
}
.hud-score {
  font-weight: 700; font-size: 1rem; padding: 7px 14px; border-radius: 999px;
  background: rgba(255,255,255,.88); box-shadow: 0 2px 8px rgba(100,70,170,.1);
  display: flex; align-items: center; gap: 5px;
}
.hud-score b { display: inline-block; min-width: 1ch; }
.hud-score.bump b { animation: bump .5s var(--spring); }
@keyframes bump { 0%{transform:scale(1)} 40%{transform:scale(1.8); color:var(--pink-500)} 100%{transform:scale(1)} }

.progress {
  position: relative; height: 10px; margin: 14px 0 4px; border-radius: 99px;
  background: rgba(255,255,255,.75); box-shadow: inset 0 1px 3px rgba(100,70,170,.12);
}
.progress-fill {
  height: 100%; width: 0; border-radius: inherit;
  background: linear-gradient(90deg, var(--lav-300), var(--pink-300));
  transition: width .65s var(--ease);
  box-shadow: 0 0 8px rgba(200,150,240,.5);
}
.progress-heart {
  position: absolute; top: 50%; left: 0; font-size: 18px;
  transform: translate(-50%,-50%); transition: left .65s var(--ease);
  filter: drop-shadow(0 2px 3px rgba(100,70,170,.35));
}
.hud-count { text-align: right; font-size: .76rem; font-weight: 600; color: var(--ink-3); }

/* ═══════════════════════════════════════════════════
   QUESTION CARD
═══════════════════════════════════════════════════ */
.q-card {
  position: relative; margin-top: 16px;
  padding: 28px 20px 20px; border-radius: 28px;
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: var(--shadow-lg);
  border: 1.5px solid rgba(255,255,255,.95);
}
.q-card::before {
  content: ''; position: absolute; inset-x: 0; top: 0; height: 3px; border-radius: 28px 28px 0 0;
  background: linear-gradient(90deg, var(--lav-300), var(--pink-300), var(--lav-300));
}
.q-card::after {
  content: ''; position: absolute; inset: 8px; border-radius: 22px; pointer-events: none;
  border: 1.5px dashed rgba(190,160,240,.35);
}
.q-card.enter { animation: cardIn .5s var(--ease); }
@keyframes cardIn { from { opacity:0; transform:translateX(36px) rotate(1.5deg); } to { opacity:1; transform:none; } }
.q-card.shake { animation: shake .4s; }
.q-label  { font-family: var(--hand); font-size: 1.4rem; color: var(--pink-500); padding: 0 4px; }
.q-text   {
  font-family: var(--serif); font-weight: 600;
  font-size: clamp(1.25rem, 5vw, 1.65rem); line-height: 1.25;
  letter-spacing: -.01em; margin: 2px 4px 0;
}

/* ═══════════════════════════════════════════════════
   OPTIONS
═══════════════════════════════════════════════════ */
.options { display: grid; gap: 10px; margin-top: 20px; position: relative; z-index: 1; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  min-height: 60px; padding: 13px 16px; border-radius: 18px;
  background: linear-gradient(180deg, #fff, var(--lav-50));
  border: 2px solid var(--lav-100); box-shadow: 0 2px 8px rgba(100,70,170,.06);
  font-weight: 600; font-size: 1rem; line-height: 1.35;
  animation: optIn .45s var(--ease) both; animation-delay: var(--d,0ms);
  transition: transform .18s var(--spring), border-color .2s, background .3s, box-shadow .2s;
}
@keyframes optIn { from{opacity:0;transform:translateY(12px) scale(.97)} to{opacity:1;transform:none} }
.opt:active:not([disabled]) { transform: scale(.97); }
@media (hover:hover) {
  .opt:hover:not([disabled]) {
    border-color: var(--lav-300); transform: translateY(-2px);
    box-shadow: 0 8px 20px -6px rgba(140,100,210,.22);
    background: linear-gradient(180deg, #fff, var(--lav-100));
  }
}
.opt .key {
  flex: none; display: grid; place-items: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--lav-100); color: var(--lav-700);
  font-weight: 800; font-size: .9rem;
  transition: background .3s, color .3s, transform .3s var(--spring);
}
.opt-text { flex: 1; overflow-wrap: anywhere; }
.opt[disabled] { cursor: default; }
.opt.correct {
  background: linear-gradient(135deg, var(--good-bg), #fdf9ff);
  border-color: var(--good); animation: pop .5s var(--spring);
  box-shadow: 0 0 20px rgba(90,200,150,.2);
}
.opt.correct .key, .opt.reveal .key { background: var(--good); color: #fff; transform: scale(1.12); }
.opt.wrong {
  background: var(--bad-bg); border-color: var(--bad); animation: shake .45s;
  box-shadow: 0 0 20px rgba(240,100,130,.18);
}
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.reveal { border-color: var(--good); border-style: dashed; background: var(--good-bg); }
.opt.dim    { opacity: .4; }
@keyframes pop   { 0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)} }
@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px) rotate(-1deg)}
  40%{transform:translateX(7px) rotate(1deg)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}

/* ═══════════════════════════════════════════════════
   FEEDBACK PANEL
═══════════════════════════════════════════════════ */
.feedback {
  display: none; margin-top: 14px; padding: 22px 20px 20px; text-align: center;
  border-radius: 24px;
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1.5px solid rgba(255,255,255,.95);
  box-shadow: var(--shadow);
}
.feedback.show  { display: block; animation: slideUp .5s var(--spring); }
@keyframes slideUp { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:none} }
.fb-title  { font-family: var(--serif); font-weight: 700; font-size: 1.3rem; line-height: 1.25; }
.fb-text   { color: var(--ink-2); margin-top: 6px; font-weight: 500; line-height: 1.5; font-size:.9rem; }
.fb-note   { font-family: var(--hand); font-size: 1.4rem; color: var(--pink-500); margin-top: 6px; line-height: 1.2; }
.fb-text:empty, .fb-note:empty { display: none; }
.feedback .btn { margin-top: 18px; }

/* ═══════════════════════════════════════════════════
   RESULT SCREEN
═══════════════════════════════════════════════════ */
.result {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 8px 0;
}
.ring-wrap { position: relative; width: 180px; height: 180px; margin: 14px auto 4px; }
.ring      { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg   { fill: none; stroke: rgba(200,180,240,.35); stroke-width: 13; }
.ring-fg   {
  fill: none; stroke: url(#ringGrad); stroke-width: 13; stroke-linecap: round;
  stroke-dasharray: 502; stroke-dashoffset: 502;
  transition: stroke-dashoffset 1.5s var(--ease);
  filter: drop-shadow(0 4px 6px rgba(140,100,210,.3));
}
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-score  { font-family: var(--serif); line-height: 1; }
.ring-score b { font-size: 3.2rem; font-weight: 700; }
.ring-score small { font-size: 1.1rem; color: var(--ink-3); font-weight: 600; margin-left: 2px; }
.ring-pct    { font-weight: 700; color: var(--pink-500); margin-top: 3px; letter-spacing: .05em; font-size: .9rem; }

.result-emoji { font-size: 46px; margin-top: 6px; animation: bounce 2.2s var(--ease) infinite; }
.result-title {
  font-family: var(--serif); font-style: italic; font-weight: 700;
  font-size: clamp(1.8rem, 8vw, 2.4rem); line-height: 1.08; letter-spacing: -.015em; margin-top: 2px;
  background: linear-gradient(90deg, var(--lav-500), var(--pink-500));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.result-msg { color: var(--ink-2); line-height: 1.6; margin: 8px auto 16px; max-width: 340px; font-weight: 500; font-size:.95rem; }
.breakdown {
  width: 100%; padding: 18px; margin-bottom: 18px; border-radius: 22px; text-align: left;
  background: rgba(255,255,255,.8); box-shadow: 0 2px 8px rgba(100,70,170,.08);
  border: 1.5px solid rgba(255,255,255,.95); display: grid; gap: 12px;
}
.bd-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: .88rem; font-weight: 600; }
.bd-row span:last-of-type { color: var(--ink-3); font-size: .8rem; }
.bd-bar { grid-column: 1/-1; height: 7px; border-radius: 99px; background: var(--lav-50); overflow: hidden; }
.bd-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--lav-300), var(--pink-300)); transition: width 1.1s var(--ease); }
.stack { display: grid; gap: 12px; width: 100%; }

/* ═══════════════════════════════════════════════════
   LETTER SCREEN
═══════════════════════════════════════════════════ */
.letter-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 10px 0; }
.env-wrap { text-align: center; }
.env-wrap.gone { animation: envGone .5s var(--ease) forwards; }
@keyframes envGone { to { opacity:0; transform:translateY(28px) scale(.9); } }
.env-title { font-family: var(--serif); font-size: 1.9rem; margin-top: 6px; }
.envelope {
  position: relative; display: block;
  width: min(280px, 80vw); aspect-ratio: 3/2; margin: 30px auto 14px;
  perspective: 900px; animation: floaty 3.2s ease-in-out infinite;
}
@keyframes floaty { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-7px) rotate(1deg)} }
.env-back,.env-front,.env-flap,.env-paper { position: absolute; display: block; }
.env-back  { inset: 0; border-radius: 10px; background: var(--pink-200); box-shadow: var(--shadow-lg); }
.env-paper {
  left:7%; right:7%; top:8%; bottom:8%; border-radius: 5px;
  background: var(--paper); background-image: repeating-linear-gradient(180deg,transparent 0 13px,rgba(190,160,240,.35) 13px 14px);
  transition: transform .7s .3s var(--ease); z-index: 1;
}
.env-front {
  inset: 0; z-index: 2; border-radius: 10px;
  background: linear-gradient(150deg, var(--pink-100), var(--lav-100));
  clip-path: polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12%;
}
.env-label { font-family: var(--hand); font-size: 1.4rem; color: var(--lav-700); }
.env-flap {
  left:0; right:0; top:0; height:58%; z-index:3;
  background: linear-gradient(180deg, var(--lav-200), var(--pink-200));
  clip-path: polygon(0 0,100% 0,50% 100%);
  transform-origin: top center; transition: transform .6s var(--ease), z-index 0s .3s;
}
.env-seal {
  position: absolute; left:50%; top:56%; z-index:4;
  width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%;
  display:grid; place-items:center; font-size:22px;
  background: radial-gradient(circle at 35% 30%, var(--pink-300), var(--pink-500));
  box-shadow: 0 6px 14px -4px rgba(220,100,150,.7), inset 0 -3px 0 rgba(0,0,0,.08);
  animation: sealPulse 1.8s ease-in-out infinite;
  transition: opacity .3s, transform .3s;
}
@keyframes sealPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.envelope.open { animation: none; }
.envelope.open .env-flap  { transform: rotateX(180deg); z-index: 0; }
.envelope.open .env-seal  { opacity: 0; transform: scale(.2); animation: none; }
.envelope.open .env-paper { transform: translateY(-48%); }
.tap-hint { font-family: var(--hand); font-size: 1.5rem; color: var(--pink-500); animation: blink 1.8s ease-in-out infinite; }
@keyframes blink { 50%{opacity:.35} }

.letter {
  position: relative; padding: 36px 22px 26px; border-radius: 6px;
  background: repeating-linear-gradient(180deg,transparent 0 34px,rgba(190,160,240,.28) 34px 35px),var(--paper);
  box-shadow: var(--shadow-lg); transform: rotate(-.7deg);
  animation: unfold .9s var(--ease);
}
.letter::before { content:''; position:absolute; top:0; bottom:0; left:16px; width:1.5px; background:rgba(230,120,160,.3); }
@keyframes unfold { from{opacity:0;transform:translateY(55px) scaleY(.62) rotate(2deg)} to{opacity:1;transform:rotate(-.7deg)} }
.letter p { opacity:0; animation: inkIn .8s var(--ease) forwards; animation-delay: var(--d,0ms); }
@keyframes inkIn { from{opacity:0;transform:translateY(8px);filter:blur(3px)} to{opacity:1;transform:none;filter:none} }
.l-greet { font-family:var(--hand); font-size:1.95rem; color:var(--lav-700); margin-bottom:10px; }
.l-body p { font-family:var(--hand); font-size:1.45rem; line-height:1.35; margin-bottom:14px; color:var(--ink); }
.l-close  { font-family:var(--hand); font-size:1.45rem; margin-top:8px; text-align:right; color:var(--ink-2); }
.l-sign   { font-family:var(--hand); font-weight:700; font-size:2.2rem; text-align:right; color:var(--pink-500); line-height:1.1; }
.l-ps     { font-family:var(--hand); font-size:1.25rem; color:var(--ink-2); margin-top:18px; }
.l-ps:empty { display:none; }
.letter-actions { margin-top:20px; animation: slideUp .6s var(--ease); }

.lock {
  text-align:center; padding:28px 20px 22px; border-radius:var(--radius);
  background:var(--paper); box-shadow:var(--shadow-lg);
}
.lock-icon  { font-size:50px; animation:bounce 2s var(--ease) infinite; }
.lock-title { font-family:var(--serif); font-size:1.75rem; margin-top:4px; }
.lock-text  { color:var(--ink-2); margin:8px 0 16px; line-height:1.5; }
#lock-form  { display:grid; gap:12px; }
#lock-input {
  font:inherit; font-size:16px; font-weight:600; text-align:center; color:var(--ink);
  padding:14px 16px; border-radius:16px; border:2px solid var(--lav-200); background:#fff;
  outline:none; -webkit-appearance:none; appearance:none;
}
#lock-input:focus { border-color:var(--lav-400); box-shadow:0 0 0 4px rgba(195,170,240,.3); }
.lock.shake    { animation:shake .45s; }
.lock-hint { font-family:var(--hand); font-size:1.3rem; color:var(--ink-2); margin-top:12px; }
.lock-hint:empty,.lock-err:empty { display:none; }
.lock-err  { color:var(--pink-500); font-weight:700; margin-top:6px; font-size:.9rem; }

/* ═══════════════════════════════════════════════════
   TAPE decorations
═══════════════════════════════════════════════════ */
.tape {
  position:absolute; top:-12px; left:50%; width:88px; height:24px; margin-left:-44px; z-index:3;
  background: repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 5px,transparent 5px 10px), rgba(245,185,210,.78);
  transform:rotate(-3.5deg);
  box-shadow: 0 1px 3px rgba(100,70,170,.08);
  -webkit-mask:linear-gradient(90deg,transparent 0 2px,#000 2px calc(100% - 2px),transparent calc(100% - 2px));
          mask:linear-gradient(90deg,transparent 0 2px,#000 2px calc(100% - 2px),transparent calc(100% - 2px));
}
.tape-l { left:16%; transform:rotate(-11deg); background-color:rgba(195,170,240,.72); }
.tape-r { left:auto; right:5%; margin-left:0; transform:rotate(8deg); background-color:rgba(195,170,240,.74); }

/* ═══════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════ */
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
  .floaters { display:none; }
}
</style>
</head>
<body>
<div class="floaters" id="floaters" aria-hidden="true"></div>
<div class="fx"       id="fx"       aria-hidden="true"></div>

<div id="scroll-wrap">
<main id="app">

  <!-- ═══ WELCOME ═══ -->
  <section class="screen active" id="screen-welcome">
    <div class="welcome">
      <div class="polaroid-stack">
        <span class="sticker s1">✦</span>
        <span class="sticker s2">♡</span>
        <span class="sticker s3">✿</span>
        <div class="polaroid p-back"><div class="photo alt"></div></div>
        <div class="polaroid p-front">
          <span class="tape"></span>
          <div class="photo" id="welcome-photo"><span class="photo-emoji">💞</span></div>
          <p class="caption" id="photo-caption">us ♡</p>
        </div>
      </div>

      <p class="eyebrow">a little game for <span data-bind="herNickname"></span></p>
      <h1 class="title" id="welcome-title">How well do you<br><em>know us?</em></h1>
      <p class="tagline" data-bind="tagline"></p>
      <div class="names">
        <span class="name-chip" data-bind="yourName"></span>
        <span class="amp">&amp;</span>
        <span class="name-chip" data-bind="herName"></span>
      </div>
      <button class="btn btn-primary" id="btn-start" type="button">Let's begin <span class="btn-heart">♡</span></button>
      <p class="meta" id="welcome-meta"></p>
    </div>
  </section>

  <!-- ═══ CHAPTER INTRO ═══ -->
  <section class="screen" id="screen-chapter">
    <div class="chapter-card">
      <span class="tape tape-l"></span>
      <p class="chapter-num"   id="chapter-num">Chapter 1</p>
      <div class="chapter-emoji" id="chapter-emoji">📖</div>
      <h2 class="chapter-title" id="chapter-title"></h2>
      <p class="chapter-desc"  id="chapter-desc"></p>
      <p class="chapter-count" id="chapter-count"></p>
      <button class="btn btn-primary btn-block" id="btn-chapter" type="button">I'm ready ✨</button>
    </div>
  </section>

  <!-- ═══ QUESTION ═══ -->
  <section class="screen" id="screen-question">
    <header class="hud">
      <div class="hud-row">
        <span class="chip" id="q-chip"></span>
        <span class="hud-score" aria-label="Score"><span>💗</span> <b id="hud-score">0</b></span>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress">
        <div class="progress-fill"  id="progress-fill"></div>
        <div class="progress-heart" id="progress-heart">💜</div>
      </div>
      <p class="hud-count" id="hud-count"></p>
    </header>

    <div class="q-card" id="q-card">
      <span class="tape tape-r"></span>
      <p class="q-label" id="q-label"></p>
      <h2 class="q-text" id="q-text"></h2>
      <div class="options" id="options"></div>
    </div>

    <div class="feedback" id="feedback" aria-live="polite">
      <p class="fb-title" id="fb-title"></p>
      <p class="fb-text"  id="fb-text"></p>
      <p class="fb-note"  id="fb-note"></p>
      <button class="btn btn-primary btn-block" id="btn-next" type="button">Next</button>
    </div>
  </section>

  <!-- ═══ RESULT ═══ -->
  <section class="screen" id="screen-result">
    <div class="result">
      <p class="eyebrow">the results are in</p>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0"   stop-color="#a98ee8"/>
              <stop offset="1"   stop-color="#f07caf"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="100" cy="100" r="80"/>
          <circle class="ring-fg" id="ring-fg" cx="100" cy="100" r="80"/>
        </svg>
        <div class="ring-center">
          <span class="ring-score"><b id="ring-score">0</b><small id="ring-total">/0</small></span>
          <span class="ring-pct" id="ring-pct">0%</span>
        </div>
      </div>
      <div class="result-emoji" id="result-emoji">💞</div>
      <h2 class="result-title"  id="result-title"></h2>
      <p  class="result-msg"    id="result-msg"></p>
      <div class="breakdown" id="breakdown"></div>
      <div class="stack">
        <button class="btn btn-primary btn-block btn-glow" id="btn-letter"  type="button">Open your secret letter 💌</button>
        <button class="btn btn-ghost  btn-block"            id="btn-replay"  type="button">Play again ↺</button>
      </div>
      <p class="meta" id="result-meta"></p>
    </div>
  </section>

  <!-- ═══ SECRET LETTER ═══ -->
  <section class="screen" id="screen-letter">
    <div class="letter-screen">
      <div class="lock" id="lock" hidden>
        <div class="lock-icon">🔐</div>
        <h2 class="lock-title">One last thing…</h2>
        <p class="lock-text" id="lock-text"></p>
        <form id="lock-form" autocomplete="off">
          <input id="lock-input" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="our secret word" aria-label="Secret word">
          <button class="btn btn-primary btn-block" type="submit">Unlock 💌</button>
        </form>
        <p class="lock-hint" id="lock-hint"></p>
        <p class="lock-err"  id="lock-err"  aria-live="polite"></p>
      </div>

      <div class="env-wrap" id="env-wrap">
        <p class="eyebrow">a secret message</p>
        <h2 class="env-title">Just for <span data-bind="herNickname"></span></h2>
        <button class="envelope" id="envelope" type="button" aria-label="Open the letter">
          <span class="env-back"></span>
          <span class="env-paper"></span>
          <span class="env-front"><span class="env-label" id="env-label"></span></span>
          <span class="env-flap"></span>
          <span class="env-seal">💜</span>
        </button>
        <p class="tap-hint">tap to open</p>
      </div>

      <article class="letter" id="letter" hidden>
        <span class="tape"></span>
        <p class="l-greet" id="l-greet"></p>
        <div class="l-body" id="l-body"></div>
        <p class="l-close" id="l-close"></p>
        <p class="l-sign"  id="l-sign"></p>
        <p class="l-ps"    id="l-ps"></p>
      </article>

      <div class="stack letter-actions" id="letter-actions" hidden>
        <button class="btn btn-primary btn-block" id="btn-letter-replay" type="button">Play again ↺</button>
        <button class="btn btn-ghost   btn-block" id="btn-letter-back"   type="button">Back to results</button>
      </div>
    </div>
  </section>

</main>
</div>

<script src="/_quiz_data.js"></script>
<script src="/_quiz_logic.js"></script>

</body>
</html>
